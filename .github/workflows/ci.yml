name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gateway:
    name: Gateway .NET (format + testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: dotnet format e testes unitários e de integração
        run: docker compose --profile test run --rm --build gateway-test

  admin:
    name: Painel Angular (build + testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build e testes com Vitest
        run: docker compose --profile test run --rm --build admin-test

  smoke:
    name: Smoke test da plataforma completa
    runs-on: ubuntu-latest
    needs: [gateway, admin]
    steps:
      - uses: actions/checkout@v4
      - name: Subir gateway, painel e observabilidade
        run: docker compose up -d --build --wait
      - name: Verificar fluxo ponta a ponta com k6
        run: docker compose --profile smoke run --rm smoke
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs gateway admin
      - name: Derrubar ambiente
        if: always()
        run: docker compose --profile smoke down -v

  publish:
    name: Publicar imagens no GHCR
    runs-on: ubuntu-latest
    needs: [smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [gateway, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Nome da imagem em minúsculas
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          target: runtime
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
