name: llm-gateway

x-gateway-env: &gateway-env
  ASPNETCORE_ENVIRONMENT: Production
  ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=llm_gateway;Username=gateway;Password=gateway
  ConnectionStrings__Redis: redis:6379
  Telemetry__MetricsEndpoint: http://prometheus:9090/api/v1/otlp/v1/metrics
  Telemetry__TracesEndpoint: http://jaeger:4318/v1/traces
  Gateway__AdminKey: ${GATEWAY_ADMIN_KEY:-dev-admin-key}
  Gateway__Providers__openai__ApiKey: ${OPENAI_API_KEY:-}
  Gateway__Providers__ollama__BaseUrl: ${OLLAMA_BASE_URL:-http://ollama:11434/v1}
  Gateway__SeedClients__0__ApiKey: ${KEY_INSIGHTQL:-gw_demo_insightql}
  Gateway__SeedClients__1__ApiKey: ${KEY_DOCFLOW:-gw_demo_docflow}
  Gateway__SeedClients__2__ApiKey: ${KEY_ZAPAGENT:-gw_demo_zapagent}
  Gateway__SeedClients__3__ApiKey: ${KEY_FARMARADAR:-gw_demo_farmaradar}
  Gateway__SeedClients__4__ApiKey: ${KEY_PLAYGROUND:-gw_demo_playground}
  Gateway__SeedClients__5__ApiKey: ${KEY_SANDBOX:-gw_demo_sandbox}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: llm_gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d llm_gateway"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  gateway:
    build:
      context: ./gateway
      target: runtime
    environment: *gateway-env
    ports:
      - "8300:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      prometheus:
        condition: service_started
      jaeger:
        condition: service_started

  admin:
    build:
      context: ./admin
      target: runtime
    environment:
      GATEWAY_URL: http://gateway:8080
      ADMIN_KEY: ${GATEWAY_ADMIN_KEY:-dev-admin-key}
    ports:
      - "8380:80"
    depends_on:
      gateway:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-otlp-receiver
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  jaeger:
    image: jaegertracing/jaeger:2.9.0

  grafana:
    image: grafana/grafana:13.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/llm-gateway.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "8330:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 30
    depends_on:
      - prometheus
      - jaeger

  ollama:
    image: ollama/ollama:latest
    profiles: [local-llm]
    volumes:
      - ollama-models:/root/.ollama

  ollama-pull:
    image: ollama/ollama:latest
    profiles: [local-llm]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "qwen2.5:7b"]
    depends_on:
      - ollama

  k6:
    image: grafana/k6:1.2.3
    profiles: [load]
    command: ["run", "/scripts/load.js"]
    environment:
      GATEWAY_URL: http://gateway:8080
      DURATION: ${LOAD_DURATION:-3m}
      KEYS: ${KEY_INSIGHTQL:-gw_demo_insightql},${KEY_DOCFLOW:-gw_demo_docflow},${KEY_ZAPAGENT:-gw_demo_zapagent},${KEY_FARMARADAR:-gw_demo_farmaradar}
      SANDBOX_KEY: ${KEY_SANDBOX:-gw_demo_sandbox}
    volumes:
      - ./load/k6:/scripts:ro
    depends_on:
      gateway:
        condition: service_healthy

  gateway-test:
    build:
      context: ./gateway
      target: test
    profiles: [test]

  admin-test:
    build:
      context: ./admin
      target: test
    profiles: [test]

  smoke:
    image: grafana/k6:1.2.3
    profiles: [smoke]
    command: ["run", "--quiet", "/scripts/smoke.js"]
    environment:
      GATEWAY_URL: http://gateway:8080
      ADMIN_URL: http://admin:80
      PROMETHEUS_URL: http://prometheus:9090
      GRAFANA_URL: http://grafana:3000
      JAEGER_URL: http://jaeger:16686
      CLIENT_KEY: ${KEY_PLAYGROUND:-gw_demo_playground}
      SANDBOX_KEY: ${KEY_SANDBOX:-gw_demo_sandbox}
    volumes:
      - ./load/k6:/scripts:ro
    depends_on:
      gateway:
        condition: service_healthy
      admin:
        condition: service_started
      grafana:
        condition: service_healthy

volumes:
  postgres-data:
  prometheus-data:
  ollama-models:
